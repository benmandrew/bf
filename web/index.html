<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Brainfuck to LLVM IR</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="prism.css">
</head>

<body>
  <div id="topbar">
    <div class="left">Brainfuck → LLVM IR</div>
    <div class="right">
      <label id="optToggle" title="Run the LLVM optimisation pipeline before emitting IR and the CFG. On by default: every pointer move carries a bounds check, and unoptimised the graph is mostly check blocks">
        <input type="checkbox" id="optimise" checked> Optimise
      </label>
      <button id="btnDownload">Download IR</button>
    </div>
  </div>

  <main id="split">
    <section class="pane" id="leftPane">
      <header>Brainfuck</header>
      <textarea id="bfEditor" spellcheck="false" aria-label="Brainfuck editor" placeholder="Type brainfuck code here..."></textarea>
      <div class="footer">Tip: press <strong>Ctrl/Cmd+Enter</strong> to compile</div>
    </section>

    <section class="pane" id="rightPane">
      <header>LLVM IR</header>
      <pre class="language-llvm" id="irView"></pre>
      <div class="footer" id="status">Ready</div>
    </section>

    <section class="pane" id="cfgPane">
      <header>Control Flow Graph</header>
      <div id="cfgView" class="cfg-view" role="img" aria-label="Control flow graph"
           title="Drag to pan · scroll to zoom · double-click to reset"></div>
      <div class="footer cfg-footer">
        <span id="cfgStatus">Ready</span>
        <span id="cfgWarn" class="warn" hidden>optimised — blocks merged/renamed, no longer mapped to source</span>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
  <script src="prism.js"></script>
</body>
</html>
