name: Build and Test

on:
  push:
    paths-ignore:
      - '*.md'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '*.md'
      - '.gitignore'

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Cache APT packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/apt-archives
          key: ${{ runner.os }}-apt-clang-format-${{ hashFiles('**/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-clang-format-
      - name: Install clang-format
        run: |
          mkdir -p ~/.cache/apt-archives
          sudo apt-get update
          sudo apt-get install -y --download-only clang-format
          cp /var/cache/apt/archives/*.deb ~/.cache/apt-archives/ 2>/dev/null || true
          sudo apt-get install -y clang-format
      - name: Check code formatting
        run: |
          mkdir -p build
          cmake -B build -S .
          cmake --build build --target fmt-ci

  lint:
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install cpplint
        run: |
          python3 -m pip install --user cpplint
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          # Verify installation
          which cpplint || python3 -m cpplint --version || true
      - name: Configure CMake
        run: |
          cmake -B build -S .
      - name: Run lint
        run: |
          cmake --build build --target lint

  test:
    strategy:
      matrix:
        build_type: [Release, Debug]
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Cache APT packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/apt-archives
          key: ${{ runner.os }}-apt-deps-${{ matrix.build_type }}-${{ hashFiles('**/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-deps-${{ matrix.build_type }}-
            ${{ runner.os }}-apt-deps-
      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: |
            build
            ~/.cache/ccache
          key: ${{ runner.os }}-cmake-${{ matrix.build_type }}-${{ hashFiles('**/CMakeLists.txt', 'src/**', 'test/**') }}
          restore-keys: |
            ${{ runner.os }}-cmake-${{ matrix.build_type }}-
            ${{ runner.os }}-cmake-
      - name: Install dependencies
        run: |
          mkdir -p ~/.cache/apt-archives
          # Restore cached packages if available
          if [ -d ~/.cache/apt-archives ] && [ "$(ls -A ~/.cache/apt-archives)" ]; then
            sudo cp ~/.cache/apt-archives/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          fi
          sudo apt-get update
          sudo apt-get install -y --download-only expect check llvm-dev llvm cmake ccache
          # Cache the downloaded packages
          cp /var/cache/apt/archives/*.deb ~/.cache/apt-archives/ 2>/dev/null || true
          sudo apt-get install -y expect check llvm-dev llvm cmake ccache
      - name: Setup ccache
        run: |
          echo "/usr/lib/ccache" >> $GITHUB_PATH
          ccache --set-config=cache_dir=~/.cache/ccache
          ccache --set-config=max_size=500M
          ccache --zero-stats
      - name: Setup LLVM tools
        run: |
          # Find LLVM tools directory and add to PATH
          LLVM_DIR=$(find /usr/lib -name "llvm-*" -type d | head -1)
          if [ -n "$LLVM_DIR" ]; then
            echo "$LLVM_DIR/bin" >> $GITHUB_PATH
            echo "Found LLVM directory: $LLVM_DIR"
            ls -la "$LLVM_DIR/bin/" || true
          fi
          # Also try common locations
          echo "/usr/bin" >> $GITHUB_PATH
          # List all available LLVM tools
          echo "Available LLVM tools:"
          ls /usr/bin/llvm-* 2>/dev/null || echo "No llvm-* tools found in /usr/bin"
          ls /usr/bin/*filecheck* 2>/dev/null || echo "No *filecheck* tools found in /usr/bin"
          # Check which package provides FileCheck
          apt-cache search filecheck || true
      - name: Configure CMake
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }}
      - name: Test
        run: cmake --build build --target tests
  docker:
    name: Push Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/bf:bfc
          file: docker/Dockerfile.bfc
          context: .
      - uses: docker/build-push-action@v5
        with:
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/bf:nginx
          file: docker/Dockerfile.nginx
          context: .
