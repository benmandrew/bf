name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup dependencies
        uses: ./.github/actions/setup-deps
      - name: Check code formatting
        run: |
          mkdir -p build
          cmake -B build -S .
          cmake --build build --target fmt-ci

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup dependencies
        uses: ./.github/actions/setup-deps
      - name: Configure CMake
        run: |
          cmake -B build -S .
      - name: Run lint
        run: |
          cmake --build build --target lint

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup dependencies
        uses: ./.github/actions/setup-deps
      - name: Install documentation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz python3-venv
      - name: Build documentation
        run: |
          cmake -B build -S .
          cmake --build build --target docs

  test:
    strategy:
      matrix:
        build_type: [Release, Debug]
    runs-on: ubuntu-latest
    needs: [lint, fmt, docs]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup dependencies
        uses: ./.github/actions/setup-deps
      - name: Configure CMake
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }}
      - name: Test
        run: cmake --build build --target tests

  docker:
    name: Push Docker Image (${{ matrix.image }}-${{ matrix.name }})
    needs: [test]
    if: github.ref == 'refs/heads/main' && github.server_url == 'https://github.com'
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: bfc
            name: linux-amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - image: bfc
            name: linux-arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
          - image: nginx
            name: linux-amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - image: nginx
            name: linux-arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
          - image: fuzz
            name: linux-amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - image: fuzz
            name: linux-arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/bf
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          platforms: ${{ matrix.platform }}
          file: docker/Dockerfile.${{ matrix.image }}
          context: .
      - name: Export digest for manifest job
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest artifact
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.image }}-${{ matrix.name }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-manifest:
    name: Push Docker Manifest (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/main' && github.server_url == 'https://github.com'
    strategy:
      fail-fast: false
      matrix:
        image: [bfc, nginx, fuzz]
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/bf
    steps:
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Download digest artifacts
        uses: actions/download-artifact@v7
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
      - name: Create multi-arch tag
        run: |
          set --
          for f in /tmp/digests/*; do
            set -- "$@" "${IMAGE}@sha256:$(basename "$f")"
          done
          docker buildx imagetools create --tag "${IMAGE}:${{ matrix.image }}" "$@"
