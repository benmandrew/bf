name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
      - name: Check code formatting
        run: |
          mkdir -p build
          nix develop -c cmake -B build -S .
          nix develop -c cmake --build build --target fmt-ci

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
      - name: Configure CMake
        run: |
          nix develop -c cmake -B build -S .
      - name: Run lint
        run: |
          nix develop -c cmake --build build --target lint

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
      - name: Build documentation
        run: |
          nix develop -c cmake -B build -S .
          nix develop -c cmake --build build --target docs

  test:
    strategy:
      matrix:
        build_type: [Release, Debug]
    runs-on: ubuntu-latest
    needs: [lint, fmt, docs]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
      - name: Configure CMake
        run: |
          nix develop -c cmake -B build -S . -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build
        run: nix develop -c cmake --build build --config ${{ matrix.build_type }}
      - name: Test
        run: nix develop -c cmake --build build --target tests

  wasm:
    name: WebAssembly build + parity
    runs-on: ubuntu-latest
    needs: [lint, fmt]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
      # emscripten and ninja come from the flake devShell, so the wasm build
      # runs entirely under `nix develop` -- no separate emsdk install.
      # The LLVM wasm libraries are the slow part; cache them keyed on the
      # build script (which pins the LLVM version and flags) so they rebuild
      # only on a bump. check-wasm.sh skips the build when the prefix is warm.
      - name: Cache LLVM wasm libraries
        uses: actions/cache@v4
        with:
          path: build-wasm/llvm
          key: wasm-llvm-${{ runner.os }}-${{ hashFiles('scripts/build-wasm-deps.sh') }}
      - name: Build native bfc (parity oracle)
        run: |
          nix develop -c cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          nix develop -c cmake --build build --target bfc
      - name: Build wasm module and check parity against native bfc
        run: nix develop -c scripts/check-wasm.sh
      # Assemble the client-side static site (HTML + JS + vendored Graphviz +
      # the wasm module) and publish it as the artifact consumers deploy. The
      # site is just static files, so any host that serves .mjs/.wasm with the
      # right MIME type will do (see web/README.md).
      - name: Stage static site
        run: nix develop -c cmake --build build --target site
      - name: Upload static site
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: build/site
          if-no-files-found: error
          retention-days: 7

  docker:
    name: Push Docker Image (${{ matrix.image }}-${{ matrix.name }})
    needs: [test]
    if: github.ref == 'refs/heads/main' && github.server_url == 'https://github.com'
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: fuzz
            name: linux-amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - image: fuzz
            name: linux-arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/bf
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          platforms: ${{ matrix.platform }}
          file: docker/Dockerfile.${{ matrix.image }}
          context: .
      - name: Export digest for manifest job
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest artifact
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.image }}-${{ matrix.name }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-manifest:
    name: Push Docker Manifest (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/main' && github.server_url == 'https://github.com'
    strategy:
      fail-fast: false
      matrix:
        image: [fuzz]
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/bf
    steps:
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Download digest artifacts
        uses: actions/download-artifact@v7
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
      - name: Create multi-arch tag
        run: |
          set --
          for f in /tmp/digests/*; do
            set -- "$@" "${IMAGE}@sha256:$(basename "$f")"
          done
          docker buildx imagetools create --tag "${IMAGE}:${{ matrix.image }}" "$@"
