name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup dependencies
        uses: ./.github/actions/setup-deps
      - name: Check code formatting
        run: |
          mkdir -p build
          cmake -B build -S .
          cmake --build build --target fmt-ci

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup dependencies
        uses: ./.github/actions/setup-deps
      - name: Configure CMake
        run: |
          cmake -B build -S .
      - name: Run lint
        run: |
          cmake --build build --target lint

  test:
    strategy:
      matrix:
        build_type: [Release, Debug]
    runs-on: ubuntu-latest
    needs: [lint, fmt]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup dependencies
        uses: ./.github/actions/setup-deps
      - name: Configure CMake
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }}
      - name: Test
        run: cmake --build build --target tests
  docker:
    name: Push Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/bf:bfc
          file: docker/Dockerfile.bfc
          context: .
      - uses: docker/build-push-action@v5
        with:
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/bf:nginx
          file: docker/Dockerfile.nginx
          context: .
