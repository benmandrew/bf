services:
  # The compiler runs client-side (bfc built to WebAssembly), so the demo is
  # just static files -- no backend service. Build the wasm module first with
  # `scripts/build-wasm.sh` (it needs the Emscripten SDK); it lands in
  # web/wasm/ and is copied into the image.
  nginx:
    image: benmandrew/bf:nginx
    build:
      context: .
      dockerfile: docker/Dockerfile.nginx
    ports:
      - '8080:80'
