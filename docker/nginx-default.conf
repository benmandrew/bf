server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ES-module workers and streaming WebAssembly demand correct MIME types:
    # a module (worker.js and its imports, including bfc.mjs) is rejected if it
    # is not served as JavaScript, and instantiateStreaming needs the wasm
    # type. nginx's default mime.types covers .js/.wasm but not .mjs, so the
    # types the site actually uses are listed explicitly here.
    types {
        text/html html;
        text/javascript js mjs;
        application/wasm wasm;
        text/css css;
        image/x-icon ico;
        application/json map;
        image/svg+xml svg;
    }
    default_type application/octet-stream;

    location / {
        try_files $uri $uri/ =404;
    }
}
